name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      # The *_generated.sv files are what EQY checks, so they must never be stale or hand-edited.
      - name: generated files are up to date
        run: |
          for d in designs/*/; do
            name=$(basename "$d")
            cargo run -- "$d$name.masm" "$d${name}_generated.sv"
          done
          git diff --exit-code designs/
